<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring REST - Home</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            transition: background-color 0.3s ease, transform 0.1s ease;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        .btn-home {
            background-color: #007bff;
        }

        .btn-home:hover {
            background-color: #0056b3;
        }

        .btn-list {
            background-color: #28a745;
        }

        .btn-list:hover {
            background-color: #218838;
        }

        .btn-id {
            background-color: #17a2b8;
        }

        .btn-id:hover {
            background-color: #138496;
        }

        .btn:active {
            transform: scale(0.98);
        }
        .search-form {
		    display: flex;
		    gap: 8px;
		    align-items: center;
		}
		
		.search-input {
		    padding: 11px 15px;
		    font-size: 16px;
		    border: 1px solid #ccc;
		    border-radius: 4px;
		    outline: none;
		    font-family: inherit;
		}
		
		.search-input:focus {
		    border-color: #17a2b8; /* Matches the blue-back info button theme */
		}
		
		button.btn {
		    border: none;
		    font-family: inherit;
		    cursor: pointer;
		}
    </style>
</head>
<body>

    <h1>Spring REST Management</h1>

    <div class="button-container">
        <a href="/home" class="btn btn-home">Home</a>
        <a href="/api/products" class="btn btn-list">List Product</a>
        <form action="/api/products/search" method="GET" class="search-form">
		    <input type="text" name="name" placeholder="Enter product name..." required class="search-input">
		    <button type="submit" class="btn btn-id">Product by Name</button>
		</form>

    </div>

</body>
</html>
